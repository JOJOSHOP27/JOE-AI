<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat Assistant - Gemini Pro</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Particle Background -->
    <div class="particles" id="particles"></div>

    <div class="chat-container">
        <!-- Header -->
        <header class="chat-header">
            <div class="header-left">
                <div class="logo">
                    <i class="fas fa-robot"></i>
                </div>
                <div>
                    <div class="header-title">AI Chat Assistant</div>
                    <div class="header-status">
                        <span class="status-dot"></span>
                        <span>Online</span>
                        <span class="status-separator">•</span>
                        <span id="messageCount">0 pesan</span>
                    </div>
                </div>
            </div>
            <div class="header-actions">
                <button class="btn-icon" id="exportBtn" title="Export Chat">
                    <i class="fas fa-download"></i>
                </button>
                <button class="btn-icon" id="clearBtn" title="Clear Chat">
                    <i class="fas fa-trash"></i>
                </button>
                <button class="btn-icon" id="themeBtn" title="Toggle Theme">
                    <i class="fas fa-moon"></i>
                </button>
                <button class="btn-icon" id="statsBtn" title="Statistics">
                    <i class="fas fa-chart-bar"></i>
                </button>
            </div>
        </header>

        <!-- Messages -->
        <div class="chat-messages" id="chatMessages">
            <!-- Messages will be added here dynamically -->
        </div>

        <!-- Typing Indicator -->
        <div class="typing-indicator" id="typingIndicator">
            <div class="typing-dots">
                <div class="typing-dot"></div>
                <div class="typing-dot"></div>
                <div class="typing-dot"></div>
            </div>
            <span class="typing-text">AI sedang mengetik...</span>
        </div>

        <!-- Input Area -->
        <div class="chat-input-area">
            <div class="input-wrapper">
                <div class="input-container">
                    <textarea 
                        id="userInput" 
                        rows="1" 
                        placeholder="Ketik pesan Anda di sini... (Shift+Enter untuk new line)"
                    ></textarea>
                    <div class="input-char-counter" id="charCounter">0</div>
                </div>
                <div class="input-actions">
                    <button class="btn-icon" id="attachBtn" title="Attach file (Coming soon)">
                        <i class="fas fa-paperclip"></i>
                    </button>
                    <button class="btn-send" id="sendBtn">
                        <span class="send-icon">➤</span>
                        <span>Kirim</span>
                    </button>
                </div>
            </div>
            <div class="quick-actions">
                <button class="quick-btn" data-prompt="Apa itu kecerdasan buatan?">🤔 AI</button>
                <button class="quick-btn" data-prompt="Buatkan puisi tentang alam">📝 Puisi</button>
                <button class="quick-btn" data-prompt="Jelaskan cara kerja internet">🌐 Internet</button>
                <button class="quick-btn" data-prompt="Tips belajar efektif">📚 Belajar</button>
                <button class="quick-btn" data-prompt="Buatkan kode HTML sederhana">💻 Kode</button>
                <button class="quick-btn" data-prompt="Ceritakan tentang masa depan teknologi">🚀 Teknologi</button>
            </div>
        </div>
    </div>

    <!-- Floating Action Button -->
    <button class="fab" id="fab" title="Scroll to bottom">
        <i class="fas fa-arrow-down"></i>
    </button>

    <!-- Scripts -->
    <script src="config.js"></script>
    <script src="script.js"></script>
</body>
</html>
